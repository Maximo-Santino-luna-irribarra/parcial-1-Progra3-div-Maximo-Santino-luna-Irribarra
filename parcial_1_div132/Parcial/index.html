<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutería</title>
    <link rel="stylesheet" href="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo" >Frutería</div>

        <div class="nombreAlumno" id ="nombreAlumno" ></div>

        <input type="text" placeholder="Search..." class="search-bar form-control w-auto ms-3">

        <div class="cart">
            <span>Cart: <span id="cart-count">0</span> items</span>
        </div>
    </nav>


    <!-- Contenedor principal -->
    <main class="container mt-4">
    <section class="products-section">

        <h2 class="text-center text-primary mb-3">Nuestras frutas</h2>
        <div class="row product-grid g-3">

        </div>
    </section>


    <!-- Sección carrito -->
    <section class="cart-section">

        <h2>Carrito</h2>

        <div id="cart-items">

            <p>No hay elementos en el carrito.</p>
        </div>

        <div class="cart-total">
            <p>Total: <span id="total-price">$0.00</span></p>
        </div>

    </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src = "../parcial/js/main.js"></script>
</body>
</html>
